<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
        body {
            background-color: #131313;
            color: #e5e2e1;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .bg-cyber {
            background-image: url('https://lh3.googleusercontent.com/aida/AEtjO1UU6EQhe7Qvzrii1R27TEGZdxoGeHDDMpDlYpk5AV5xc9v-2qCMy7qcMYhowfs9adTgMP3eKBodV647ndZjvW8Nb3ayArRBmZHdWw8sJyBZCc0OE2c5DQ7cOFxIrOzYhb3Xu1zeF9pSa_qdiYEibNkl_w36QShX0GOzeMRa8aDV4-tUhOcKND2y0TpAUyiHcIgALU_a7epFbYfl1XoBxwZjDNF3bDGS_mhuUecSZG5d3kgQ2qADyaUha7T_');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.3;
        }

        .glass-panel {
            background: rgba(19, 19, 19, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glitch-anim {
            animation: glitch 3s infinite alternate;
        }

        @keyframes glitch {
            0% { opacity: 1; transform: translate(0); }
            5% { opacity: 0.8; transform: translate(-2px, 1px); }
            10% { opacity: 1; transform: translate(2px, -1px); }
            15% { opacity: 0.9; transform: translate(0); }
            100% { opacity: 1; transform: translate(0); }
        }

        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="bg-cyber relative">
<div class="scanlines"></div>
<div class="absolute inset-0 bg-black/60 pointer-events-none z-0"></div> <!-- Dimmer -->
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-dim/80 backdrop-blur-md border-b border-white/10 flex justify-between items-center px-margin-mobile h-14 w-full flat no shadows">
<button aria-label="Menu" class="text-secondary hover:text-secondary transition-colors active:opacity-70 flex items-center justify-center p-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">security</span>
</button>
<h1 class="font-label-caps text-label-caps tracking-widest text-secondary drop-shadow-[0_0_4px_#4edea3]">OBSCURA</h1>
<button aria-label="Sensors" class="text-outline hover:text-secondary transition-colors active:opacity-70 flex items-center justify-center p-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">sensors</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col justify-center items-center relative z-10 pt-14 pb-safe md:pb-0 px-margin-mobile">
<!-- Search Input Context (Static for Empty State) -->
<div class="w-full max-w-2xl mb-8 opacity-50 mt-4 md:mt-8 glass-panel p-4 rounded-DEFAULT hidden md:block">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-outline">search</span>
<div class="font-code-md text-code-md text-outline flex-grow">target: unknown</div>
</div>
<div class="h-px bg-white/10 w-full mt-2"></div>
</div>
<!-- Empty State Container -->
<div class="flex flex-col items-center justify-center text-center max-w-md w-full glass-panel p-8 rounded-lg glitch-anim">
<!-- Radar Icon -->
<div class="relative w-24 h-24 mb-6 flex items-center justify-center">
<!-- Decorative concentric circles -->
<div class="absolute inset-0 rounded-full border border-secondary/20 animate-ping" style="animation-duration: 3s;"></div>
<div class="absolute inset-4 rounded-full border border-secondary/30"></div>
<div class="absolute inset-8 rounded-full border border-secondary/40"></div>
<span class="material-symbols-outlined text-secondary drop-shadow-[0_0_8px_#4edea3] text-5xl relative z-10">radar</span>
<!-- Slash -->
<div class="absolute inset-0 flex items-center justify-center rotate-45 z-20">
<div class="h-16 w-0.5 bg-error drop-shadow-[0_0_4px_#ffb4ab]"></div>
</div>
</div>
<!-- Messages -->
<h2 class="font-headline-md text-headline-md text-on-surface mb-2 tracking-widest uppercase">Awaiting Query</h2>
<p class="font-code-sm text-code-sm text-outline-variant tracking-[0.2em] mb-8">NO ACTIVE TRACES</p>
<!-- Action Prompt (Fictional) -->
<button class="px-6 py-3 border border-secondary/50 rounded-DEFAULT font-label-caps text-label-caps text-secondary hover:bg-secondary hover:text-surface transition-all duration-300 active:scale-95">
                INITIATE SCAN
            </button>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container/90 backdrop-blur-xl border-t border-white/15 flex justify-around items-center h-16 w-full px-2 flat no shadows md:hidden">
<button class="flex flex-col items-center justify-center text-secondary drop-shadow-[0_0_4px_#4edea3] border-t-2 border-secondary -mt-[1px] hover:bg-white/5 active:scale-95 transition-transform flex-1 h-full pt-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">search</span>
<span class="font-label-caps text-label-caps mt-1">SEARCH</span>
</button>
<button class="flex flex-col items-center justify-center text-outline-variant hover:bg-white/5 active:scale-95 transition-transform flex-1 h-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">terminal</span>
<span class="font-label-caps text-label-caps mt-1">SCRAPE</span>
</button>
<button class="flex flex-col items-center justify-center text-outline-variant hover:bg-white/5 active:scale-95 transition-transform flex-1 h-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">monitoring</span>
<span class="font-label-caps text-label-caps mt-1">MONITOR</span>
</button>
<button class="flex flex-col items-center justify-center text-outline-variant hover:bg-white/5 active:scale-95 transition-transform flex-1 h-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
<span class="font-label-caps text-label-caps mt-1">INTEL</span>
</button>
</nav>
<!-- NavigationDrawer (Desktop Only) -->
<aside class="hidden md:flex flex-col h-full py-safe fixed left-0 top-14 bottom-0 z-40 bg-surface-container-highest/95 backdrop-blur-2xl border-r border-white/10 h-full w-80 flat no shadows">
<!-- Profile Header -->
<div class="p-6 border-b border-white/10 flex items-center gap-4">
<div class="w-12 h-12 rounded-DEFAULT bg-surface-bright border border-white/20 flex items-center justify-center overflow-hidden">
<span class="font-label-caps text-label-caps text-outline">OP</span>
</div>
<div class="flex flex-col">
<span class="font-code-md text-code-md text-on-surface">OP_SEC_01</span>
<span class="font-label-caps text-label-caps text-outline-variant">LEVEL 4 ACCESS</span>
</div>
</div>
<div class="px-6 py-2">
<span class="font-label-caps text-label-caps text-secondary drop-shadow-[0_0_2px_#4edea3]">ENCRYPTED</span>
</div>
<nav class="flex-grow py-4 flex flex-col gap-2">
<!-- Dashboard (Inactive) -->
<a class="flex items-center gap-4 px-6 py-3 text-on-surface-variant hover:bg-white/5 transition-all duration-200" href="#">
<span class="material-symbols-outlined">grid_view</span>
<span class="font-code-md text-code-md">DASHBOARD</span>
</a>
<!-- Search (Active - Mapped semantically) -->
<a class="flex items-center gap-4 px-6 py-3 bg-secondary/10 text-secondary border-l-4 border-secondary transition-all duration-200" href="#">
<span class="material-symbols-outlined text-secondary drop-shadow-[0_0_4px_#4edea3]">search</span>
<span class="font-code-md text-code-md">SEARCH</span>
</a>
<!-- Proxy Config (Inactive) -->
<a class="flex items-center gap-4 px-6 py-3 text-on-surface-variant hover:bg-white/5 transition-all duration-200" href="#">
<span class="material-symbols-outlined">router</span>
<span class="font-code-md text-code-md">PROXY CONFIG</span>
</a>
<!-- API Keys (Inactive) -->
<a class="flex items-center gap-4 px-6 py-3 text-on-surface-variant hover:bg-white/5 transition-all duration-200" href="#">
<span class="material-symbols-outlined">key</span>
<span class="font-code-md text-code-md">API KEYS</span>
</a>
</nav>
<div class="p-6 border-t border-white/10 mt-auto">
<a class="flex items-center gap-4 text-on-surface-variant hover:bg-white/5 transition-all duration-200 px-2 py-2 -mx-2 rounded" href="#">
<span class="material-symbols-outlined">logout</span>
<span class="font-code-md text-code-md">LOGOUT</span>
</a>
</div>
</aside>
</body></html>
