# ═══════════════════════════════════════════════════════════════
# GPU Platform GUI — Nginx Configuration
# Serves static files + proxies WebSocket connections
# ═══════════════════════════════════════════════════════════════

server {
    listen ${GPU_PORT};
    server_name _;

    # ── Root & Index ─────────────────────────────────────────
    root /usr/share/nginx/html;
    index gpu_nited.html;

    # ── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss: http: https:; font-src 'self' data:;" always;

    # ── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── Health Check Endpoint ────────────────────────────────
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"gpu-platform","version":"1.0.0"}';
    }

    # ── API Status Endpoint ──────────────────────────────────
    location = /api/status {
        access_log off;
        default_type application/json;
        return 200 '{"service":"gpu-platform","gui":"gpu_nited.html","version":"1.0.0","agents":18}';
    }

    # ── Static Files ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /gpu_nited.html;

        # Cache static assets
        location ~* \.(css|js|json|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── WebSocket Proxy ──────────────────────────────────────
    # Forward WebSocket connections to the Node.js backend
    location /ws {
        proxy_pass http://127.0.0.1:${GPU_WS_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── API Proxy (optional) ─────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:${GPU_WS_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Block sensitive paths ────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|log|bak|sql|db)$ {
        deny all;
    }

    # ── Error Pages ──────────────────────────────────────────
    error_page 404 /gpu_nited.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
