services:
  fcm-bootstrap:
    image: ipfs/kubo:latest
    container_name: fcm-ipfs-node
    volumes:
      - ipfs-data:/data/ipfs
      - ./config/ipfs-swarm.key:/key/swarm.key:ro
    ports:
      - "4001:4001"
      - "4002:4002/udp"
      - "5001:5001"
      - "8080:8080"
    environment:
      - IPFS_SWARM_KEY=/key/swarm.key
      - IPFS_PROFILE=server
    command: ["daemon", "--migrate=true", "--enable-pubsub-experiment"]
    networks:
      - fcm-mesh
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 30s
      timeout: 10s
      retries: 3

  inference-router:
    build: { context: ., dockerfile: docker/Dockerfile, target: production }
    container_name: fcm-inference-router
    runtime: nvidia
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 8g
    cpus: 4
    ports:
      - "8081:8081"
    environment:
      - FCM_AGENT_TYPE=inference
      - FCM_AGENT_ID=inf-router-001
      - FCM_DID=did:ipfs:QmInfRouter
      - FCM_STAKE=500
      - FCM_CAPABILITIES=gpu,cuda,avx512
      - FCM_GEOHASH=u4pru
      - FCM_REGISTRY_CONTRACT=${REGISTRY_CONTRACT}
      - FCM_RPC_URL=${RPC_URL}
      - FCM_PRIVATE_KEY=${INFERENCE_ROUTER_KEY:-${PRIVATE_KEY}}
      - NVIDIA_VISIBLE_DEVICES=all
      - HEALTH_PORT=8081
    volumes:
      - model-cache:/fcm/models
      - ./config/inference-router.yaml:/fcm/config/agent.yaml:ro
    depends_on:
      fcm-bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - fcm-mesh
    restart: unless-stopped

  render-splitter:
    build: { context: ., dockerfile: docker/Dockerfile, target: production }
    container_name: fcm-render-splitter
    runtime: nvidia
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 8g
    cpus: 4
    ports:
      - "8082:8081"
    environment:
      - FCM_AGENT_TYPE=render
      - FCM_AGENT_ID=render-split-001
      - FCM_DID=did:ipfs:QmRenderSplitter
      - FCM_STAKE=500
      - FCM_CAPABILITIES=gpu,vulkan,tee
      - FCM_GEOHASH=u4pru
      - FCM_REGISTRY_CONTRACT=${REGISTRY_CONTRACT}
      - FCM_RPC_URL=${RPC_URL}
      - FCM_PRIVATE_KEY=${RENDER_SPLITTER_KEY:-${PRIVATE_KEY}}
      - HEALTH_PORT=8081
    volumes:
      - render-cache:/fcm/renders
      - ./config/render-splitter.yaml:/fcm/config/agent.yaml:ro
    depends_on:
      fcm-bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - fcm-mesh
    restart: unless-stopped

  fl-coordinator:
    build: { context: ., dockerfile: docker/Dockerfile, target: production }
    container_name: fcm-fl-coordinator
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    mem_limit: 4g
    cpus: 2
    environment:
      - FCM_AGENT_TYPE=federated_learning
      - FCM_AGENT_ID=fl-coord-001
      - FCM_DID=did:ipfs:QmFLCoordinator
      - FCM_STAKE=1000
      - FCM_CAPABILITIES=tee,sgx,avx512
      - FCM_GEOHASH=u4pru
      - FCM_REGISTRY_CONTRACT=${REGISTRY_CONTRACT}
      - FCM_RPC_URL=${RPC_URL}
      - FCM_PRIVATE_KEY=${FL_COORDINATOR_KEY:-${PRIVATE_KEY}}
      - FCM_DP_EPSILON=1.0
      - FCM_MPC_THRESHOLD=3
    volumes:
      - fl-models:/fcm/fl-models
      - ./config/fl-coordinator.yaml:/fcm/config/agent.yaml:ro
    devices:
      - /dev/sgx_enclave
      - /dev/sgx_provision
    depends_on:
      fcm-bootstrap:
        condition: service_healthy
    networks:
      - fcm-mesh
    restart: unless-stopped

  edge-runner:
    build: { context: ., dockerfile: docker/Dockerfile, target: production }
    container_name: fcm-edge-runner
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    mem_limit: 2g
    cpus: 1
    environment:
      - FCM_AGENT_TYPE=edge
      - FCM_AGENT_ID=edge-run-001
      - FCM_DID=did:ipfs:QmEdgeRunner
      - FCM_STAKE=500
      - FCM_CAPABILITIES=wasm,neon,avx2
      - FCM_GEOHASH=u4pru
      - FCM_REGISTRY_CONTRACT=${REGISTRY_CONTRACT}
      - FCM_RPC_URL=${RPC_URL}
      - FCM_PRIVATE_KEY=${EDGE_RUNNER_KEY:-${PRIVATE_KEY}}
      - FCM_WASM_POOL_SIZE=100
      - FCM_MEMORY_LIMIT_MB=128
    volumes:
      - wasm-modules:/fcm/wasm
      - ./config/edge-runner.yaml:/fcm/config/agent.yaml:ro
    depends_on:
      fcm-bootstrap:
        condition: service_healthy
    networks:
      - fcm-mesh
    restart: unless-stopped

  zk-prover:
    build: { context: ., dockerfile: docker/Dockerfile, target: production }
    container_name: fcm-zk-prover
    runtime: nvidia
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 16g
    cpus: 4
    environment:
      - FCM_AGENT_TYPE=zk_prover
      - FCM_AGENT_ID=zk-prover-001
      - FCM_DID=did:ipfs:QmZKProver
      - FCM_STAKE=750
      - FCM_CAPABILITIES=gpu,cuda,npu
      - FCM_GEOHASH=u4pru
      - FCM_REGISTRY_CONTRACT=${REGISTRY_CONTRACT}
      - FCM_RPC_URL=${RPC_URL}
      - FCM_PRIVATE_KEY=${ZK_PROVER_KEY:-${PRIVATE_KEY}}
      - FCM_AGGREGATION_THRESHOLD=16
    volumes:
      - zk-circuits:/fcm/circuits
      - ./config/zk-prover.yaml:/fcm/config/agent.yaml:ro
    networks:
      - fcm-mesh
    restart: unless-stopped

  game-host:
    build: { context: ., dockerfile: docker/Dockerfile, target: production }
    container_name: fcm-game-host
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    mem_limit: 4g
    cpus: 2
    environment:
      - FCM_AGENT_TYPE=game
      - FCM_AGENT_ID=game-host-001
      - FCM_DID=did:ipfs:QmGameHost
      - FCM_STAKE=500
      - FCM_CAPABILITIES=gpu,metal,avx2
      - FCM_GEOHASH=u4pru
      - FCM_REGISTRY_CONTRACT=${REGISTRY_CONTRACT}
      - FCM_RPC_URL=${RPC_URL}
      - FCM_PRIVATE_KEY=${GAME_HOST_KEY:-${PRIVATE_KEY}}
      - FCM_TICK_RATE=128
      - FCM_MAX_PLAYERS=64
    ports:
      - "7777:7777/udp"
    volumes:
      - game-maps:/fcm/maps
      - ./config/game-host.yaml:/fcm/config/agent.yaml:ro
    depends_on:
      fcm-bootstrap:
        condition: service_healthy
    networks:
      - fcm-mesh
    restart: unless-stopped

  science-grid:
    build: { context: ., dockerfile: docker/Dockerfile, target: production }
    container_name: fcm-science-grid
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    mem_limit: 8g
    cpus: 4
    environment:
      - FCM_AGENT_TYPE=science
      - FCM_AGENT_ID=sci-grid-001
      - FCM_DID=did:ipfs:QmScienceGrid
      - FCM_STAKE=500
      - FCM_CAPABILITIES=avx512,mpi,openmp
      - FCM_GEOHASH=u4pru
      - FCM_REGISTRY_CONTRACT=${REGISTRY_CONTRACT}
      - FCM_RPC_URL=${RPC_URL}
      - FCM_PRIVATE_KEY=${SCIENCE_GRID_KEY:-${PRIVATE_KEY}}
      - FCM_CHECKPOINT_INTERVAL=900
      - FCM_REDUNDANCY_FACTOR=3
    volumes:
      - science-data:/fcm/science
      - ./config/science-grid.yaml:/fcm/config/agent.yaml:ro
    depends_on:
      fcm-bootstrap:
        condition: service_healthy
    networks:
      - fcm-mesh
    restart: unless-stopped

  privacy-mesh:
    build: { context: ., dockerfile: docker/Dockerfile, target: production }
    container_name: fcm-privacy-mesh
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    mem_limit: 4g
    cpus: 2
    environment:
      - FCM_AGENT_TYPE=privacy
      - FCM_AGENT_ID=priv-mesh-001
      - FCM_DID=did:ipfs:QmPrivacyMesh
      - FCM_STAKE=1000
      - FCM_CAPABILITIES=tee,sgx,neon
      - FCM_GEOHASH=u4pru
      - FCM_REGISTRY_CONTRACT=${REGISTRY_CONTRACT}
      - FCM_RPC_URL=${RPC_URL}
      - FCM_PRIVATE_KEY=${PRIVACY_MESH_KEY:-${PRIVATE_KEY}}
      - FCM_MIN_HOPS=3
      - FCM_COVER_TRAFFIC_RATIO=0.3
    ports:
      - "9001:9001"
      - "9001:9001/udp"
    volumes:
      - relay-keys:/fcm/keys
      - ./config/privacy-mesh.yaml:/fcm/config/agent.yaml:ro
    depends_on:
      fcm-bootstrap:
        condition: service_healthy
    networks:
      - fcm-mesh
    restart: unless-stopped

  gpu-platform:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu-platform
      target: production
    container_name: fcm-gpu-platform
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    mem_limit: 1g
    cpus: 2
    ports:
      - "${GPU_PORT:-9091}:9091"
      - "${GPU_WS_PORT:-9092}:9092"
    environment:
      - GPU_PORT=9091
      - GPU_WS_PORT=9092
      - GPU_WS_ENABLED=true
      - GPU_OBSURA_ENABLED=${GPU_OBSURA_ENABLED:-false}
      - GPU_OBSURA_PORT=9222
      # The live GUI/backend reads the FCM_* names below.
      - GPU_RPC_URL=${FCM_RPC_URL:-${RPC_URL:-http://localhost:8545}}
      - GPU_REGISTRY_CONTRACT=${FCM_REGISTRY:-${REGISTRY_CONTRACT:-}}
      - FCM_RPC_URL=${FCM_RPC_URL:-${RPC_URL:-http://localhost:8545}}
      - FCM_REGISTRY=${FCM_REGISTRY:-${REGISTRY_CONTRACT:-}}
      - FCM_TOKEN=${FCM_TOKEN:-${FCM_TOKEN_CONTRACT:-}}
      - FCM_TIER_STAKING=${FCM_TIER_STAKING:-${FCM_TIER_STAKING_CONTRACT:-}}
      - FCM_GOVERNANCE=${FCM_GOVERNANCE:-${FCM_GOVERNANCE_CONTRACT:-}}
      - FCM_ESCROW=${FCM_ESCROW:-${FCM_ESCROW_CONTRACT:-}}
      - FCM_REPUTATION_NFT=${FCM_REPUTATION_NFT:-${FCM_REPUTATION_NFT_CONTRACT:-}}
      - FCM_REWARDS_POOL=${FCM_REWARDS_POOL:-${FCM_REWARDS_POOL_CONTRACT:-}}
      - GPU_AUTH_SECRET=${GPU_AUTH_SECRET:-${FCM_AUTH_SECRET:-}}
      - FCM_AUTH_SECRET=${FCM_AUTH_SECRET:-${GPU_AUTH_SECRET:-}}
      - GPU_AUTH_REQUIRED=${GPU_AUTH_REQUIRED:-true}
      - FCM_AUTH_REQUIRED=${FCM_AUTH_REQUIRED:-true}
    volumes:
      - gpu-data:/opt/gpu-platform/data
    networks:
      - fcm-mesh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  obscura-search:
    build:
      context: ..
      dockerfile: docker/Dockerfile.search
      target: production
    container_name: fcm-obscura-search
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    mem_limit: 256m
    cpus: 1
    expose:
      - "3001"
    environment:
      - OBSCURA_PORT=3001
      - OBSCURA_CDP=${OBSCURA_CDP:-9222}
      - NODE_ENV=production
    networks:
      - fcm-mesh
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/obscura/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  obscura-nginx:
    image: nginx:alpine
    container_name: fcm-obscura-nginx
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
        reservations:
          cpus: '0.1'
          memory: 32M
    mem_limit: 64m
    cpus: 0.5
    ports:
      - "${OBSCURA_PORT:-3001}:80"
    volumes:
      - ./nginx/search.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      obscura-search:
        condition: service_healthy
    networks:
      - fcm-mesh
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: fcm-prometheus
    user: "nobody"
    read_only: true
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - fcm-mesh

  grafana:
    image: grafana/grafana:latest
    container_name: fcm-grafana
    user: "472"
    read_only: true
    volumes:
      - ./config/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      - GF_SECURITY_ALLOW_EMBEDDING=false
    networks:
      - fcm-mesh

volumes:
  gpu-data:
  ipfs-data:
  model-cache:
  render-cache:
  fl-models:
  wasm-modules:
  zk-circuits:
  game-maps:
  science-data:
  relay-keys:
  prometheus-data:
  grafana-data:

networks:
  fcm-mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
