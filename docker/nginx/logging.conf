# Obscura Search — Nginx Logging Configuration
# Detailed access logs for monitoring and analytics

# ─── Log Formats ──────────────────────────────────────────────

# Standard JSON format for log aggregators (ELK, Loki, etc.)
log_format json_combined escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher",'
        '"request_length":$request_length,'
        '"connection":$connection,'
        '"connection_requests":$connection_requests,'
        '"pipe":"$pipe",'
        '"gzip_ratio":"$gzip_ratio"'
    '}';

# Human-readable format for debugging
log_format detailed
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct=$upstream_connect_time '
    'uht=$upstream_header_time urt=$upstream_response_time';

# Metrics format for Prometheus/Grafana (pipe-separated)
log_format metrics
    '$time_iso8601|$remote_addr|$request_method|$request_uri|$status|'
    '$body_bytes_sent|$request_time|$upstream_response_time|'
    '$ssl_protocol|$connection_requests';

# ─── Access Logs ──────────────────────────────────────────────

# Main access log (JSON format)
access_log /var/log/nginx/access.log json_combined buffer=16k flush=5s;

# Metrics log (for monitoring pipeline)
access_log /var/log/nginx/metrics.log metrics buffer=8k flush=10s;

# Error log
error_log /var/log/nginx/error.log warn;

# ─── Status Endpoint for Prometheus ───────────────────────────
# Enable nginx stub_status for monitoring
server {
    listen 8080;
    server_name localhost;

    # Only allow internal network
    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny all;

    location /nginx_status {
        stub_status on;
        access_log off;
    }

    # Health check for nginx itself
    location /nginx_health {
        return 200 '{"status":"ok","service":"nginx"}';
        add_header Content-Type application/json;
    }
}
