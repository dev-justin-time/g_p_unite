# Obscura Search — Nginx SSL Configuration with Let's Encrypt
# HTTP → HTTPS redirect + SSL termination

# ─── Rate Limit Zones ─────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=bulk_limit:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=ws_limit:10m;
limit_req_zone $binary_remote_addr zone=ws_connect:10m rate=10r/m;

# ─── Upstream ─────────────────────────────────────────────────
upstream obscura_backend {
    server obscura-search:3001;
    keepalive 16;
}

# ─── Rate Limit Response ──────────────────────────────────────
limit_req_status 429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── HTTP → HTTPS Redirect ────────────────────────────────────
server {
    listen 80;
    server_name ${DOMAIN};

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS Server ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name ${DOMAIN};

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (uncomment after confirming SSL works)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── General Rate Limit ───────────────────────────────────
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://obscura_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ─── Search Endpoint (stricter limits) ──────────────────
    location = /api/obscura/search {
        limit_req zone=search_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://obscura_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 45s;
        proxy_read_timeout 45s;
    }

    # ─── Bulk Scrape (strictest limits) ─────────────────────
    location = /api/obscura/bulk-scrape {
        limit_req zone=bulk_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://obscura_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    # ─── Scrape Endpoint ────────────────────────────────────
    location = /api/obscura/scrape {
        limit_req zone=search_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://obscura_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ─── WebSocket Endpoint ─────────────────────────────────
    location = /ws {
        limit_conn ws_limit 5;
        limit_req zone=ws_connect burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://obscura_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # ─── Health Check ───────────────────────────────────────
    location = /health {
        limit_req zone=api_limit burst=5 nodelay;
        access_log off;

        proxy_pass http://obscura_backend/api/obscura/status;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ─── Static Files (GUI) ─────────────────────────────────
    location /search/ {
        alias /usr/share/nginx/html/search/;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ─── Let's Encrypt ACME Challenge ───────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ─── Custom Error Pages ─────────────────────────────────
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"Rate limit exceeded","retry_after":1,"message":"Too many requests. Please slow down."}';
    }

    error_page 502 = @bad_gateway;
    location @bad_gateway {
        default_type application/json;
        return 502 '{"error":"Service unavailable","message":"Obscura Search server is not running."}';
    }

    error_page 504 = @gateway_timeout;
    location @gateway_timeout {
        default_type application/json;
        return 504 '{"error":"Gateway timeout","message":"Request took too long to process."}';
    }
}
